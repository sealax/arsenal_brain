name: MCP retrieval and evidence
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-demo.lock
      - run: python -m pytest -q
      - run: python scripts/evaluate_retrieval.py
      - run: python scripts/verify_evidence.py evidence/2026-10-23/founding.json evidence/2026-10-23/missing.json evidence/2026-10-23/unsupported-match.json
